# Paylaşılan giriş alt akışı. Kimlik bilgisi dosyada DEĞİL, ortamdan gelir
# (TESTFUL_LOGIN_USER / TESTFUL_LOGIN_PASSWORD → testful run bunları -e ile geçirir).
appId: dev.testful.demo
---
- extendedWaitUntil:
    visible: "Hoş geldin"
    timeout: 30000
- tapOn: "E-posta"
- inputText: ${TESTFUL_LOGIN_USER}
- tapOn: "Şifre"
- inputText: ${TESTFUL_LOGIN_PASSWORD}
- hideKeyboard
- tapOn: "Giriş"
- extendedWaitUntil:
    visible: "Testful Demo"
    timeout: 15000
